<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de notas, Colegio Bilingüe Campo Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#0e4f4b;--teal:#14706a;--mint:#e3f1ef;--paper:#fbfdfc;--ink:#14282a;--mut:#58706e;--line:#cfe0dd;--amber:#d99a1e;--red:#b42318;--ok:#0a7a4b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Figtree,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{margin:0 0 .4rem;line-height:1.2}
h2{font-size:1.4rem}h3{font-size:1.15rem}
.mut{color:var(--mut)}.err{color:var(--red);min-height:1.4em}
/* Encabezado con el corte diagonal de las boletas */
header.top{position:relative;display:flex;align-items:center;gap:1rem;padding:.8rem 1.5rem;background:var(--deep);color:#fff;margin-bottom:1.3rem}
header.top::after{content:"";position:absolute;left:0;right:0;top:100%;height:1.3rem;background:var(--deep);clip-path:polygon(0 0,100% 0,0 100%)}
.tit{display:grid;line-height:1.2}.tit small{opacity:.8}
.user{margin-left:auto;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;justify-content:flex-end}
.user em{font-style:normal;background:rgba(255,255,255,.16);border-radius:99px;padding:.1rem .7rem;font-size:.85rem}
.logo{width:2.7rem;height:2.7rem;border-radius:50%;background:#fff;object-fit:contain;flex:none}
.logo.ph{display:grid;place-items:center;color:var(--deep);font-weight:800}
.logo.grande{width:4.6rem;height:4.6rem;margin:0 auto 1rem;display:block}
.logo.grande.ph{display:grid;font-size:1.4rem;background:var(--mint)}
.wrap{display:grid;grid-template-columns:13rem 1fr;gap:2rem;max-width:72rem;margin:0 auto;padding:1.5rem}
nav{display:flex;flex-direction:column;gap:.15rem;align-self:start}
nav button{text-align:left;border:0;border-left:3px solid transparent;background:none;padding:.55rem .8rem;cursor:pointer;border-radius:0 8px 8px 0}
nav button:hover:not(:disabled){background:var(--mint)}
nav button.on{border-left-color:var(--teal);background:var(--mint);font-weight:600}
nav button:disabled{color:var(--mut);cursor:default}
nav i{font-style:normal;font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:0 .5em;margin-left:.3em}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1.25rem;margin-bottom:1.2rem}
.sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem;margin-top:.8rem}
label{display:grid;gap:.3rem;font-weight:600;font-size:.92rem}
select,input[type=email],input[type=password],input.busca{padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
input.busca{margin:.7rem 0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--mut);border-bottom:2px solid var(--deep);padding:.4rem .6rem;white-space:nowrap}
td{padding:.3rem .6rem}
tbody tr:nth-child(even) td{background:#f1f6f5}
input.nota{width:7.5rem;text-align:center;border:1px solid var(--line);border-radius:6px;padding:.35rem;font-variant-numeric:tabular-nums;background:#fff}
input.nota.r1{background:#c2cac9}input.nota.r2{background:#e2e7e6}
input.nota.malo{outline:2px solid var(--red)}
input.nota:disabled{background:#eef2f1;color:var(--mut)}
.btn{background:var(--deep);color:#fff;border:1px solid var(--deep);padding:.6rem 1.1rem;border-radius:8px;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--deep)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pie{margin-top:1rem}
.tag{border-radius:99px;padding:.1rem .7rem;font-size:.85rem;font-weight:600}
.tag.ok{background:#d8f1e4;color:var(--ok)}.tag.mal{background:#fbe0dd;color:var(--red)}
.aviso{background:#fbeccb;border-radius:8px;padding:.6rem .9rem;margin:0 0 .8rem}
.login{min-height:100vh;display:grid;place-items:center;background:var(--deep);padding:1rem}
.login form{width:min(24rem,100%);display:grid;gap:.9rem;text-align:center;background:#fff;border-radius:12px;padding:2rem 1.6rem}
.login label{text-align:left}
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;z-index:9}
#toast.show{opacity:1}#toast.mal{background:var(--red)}#toast.ok{background:var(--ok)}
table.n input.nota{width:4.8rem}
th.ev{cursor:pointer}th small{display:block;font-weight:400}
td.t{font-weight:800;text-align:center}td.z{text-align:center}
.barra{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0}
table.est th,table.est td{text-align:center}table.est td{font-size:1.2rem;font-weight:600}
input.txt{padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.boleta{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1.2rem 1.4rem;margin:1rem 0;color:#000}
.boleta h3{margin:0}.boleta p{margin:.2rem 0}.boleta .bal span{margin-left:1.2rem}
.boleta table{margin:.8rem 0;font-size:.88rem}
.boleta th,.boleta td{border:1px solid #888;padding:.22rem .5rem;white-space:normal;background:none!important;color:#000}
.boleta th.area{background:#e8eeed!important;text-align:left}.boleta .c{text-align:center}
.boleta .firmas{display:flex;justify-content:space-around;margin-top:2.2rem}.boleta .firmas span{border-top:1px solid #000;padding:.2rem 2rem}
@media print{header.top,nav,.no-print{display:none!important}.wrap{display:block;padding:0;max-width:none}.boleta{border:0;margin:0;padding:.4cm;page-break-after:always;break-after:page}}
@media(max-width:760px){
  .wrap{grid-template-columns:1fr;gap:1rem;padding:1rem}
  nav{flex-direction:row;overflow-x:auto}
  nav button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;border-radius:8px 8px 0 0}
  nav button.on{border-bottom-color:var(--teal)}
  header.top{padding:.7rem 1rem}
}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
/* ===== CONFIGURACIÓN: lo único que se edita ===== */
const CONFIG = {
  SUPABASE_URL: 'https://tplrhlwbanofefojwbib.supabase.co',
  SUPABASE_KEY: 'sb_publishable_f_E2Dq5PBhXWETmcC-1qfQ_KgtHZhJM',
  COLEGIO: 'Colegio Bilingüe Campo Real',
  LOGO: 'logo.png'   // sube tu logo con este nombre junto a este archivo
};
/* ================================================ */

const ROLES = {administrador:'Administrador',director:'Director',coordinador:'Coordinador',subcoordinador:'Subcoordinador',docente:'Docente',caja:'Caja'};
const DIR = ['administrador','director','coordinador'];
const MODULOS = [
  {id:'notas',n:'Notas',r:[...DIR,'subcoordinador','docente'],f:()=>vistaNotas()},
  {id:'unidades',n:'Unidades',r:DIR,f:()=>vistaUnidades()},
  {id:'solvencia',n:'Solvencia',r:[...DIR,'caja'],f:()=>vistaSolvencia()},
  {id:'alumnos',n:'Alumnos',r:[...DIR,'subcoordinador']},
  {id:'boletas',n:'Boletas',r:DIR,f:()=>vistaBoletas()},
  {id:'comentarios',n:'Comentarios',r:DIR},
  {id:'importar',n:'Importar datos',r:['administrador'],f:()=>vistaImportar()},
  {id:'asignaciones',n:'Asignaciones',r:DIR,f:()=>vistaAsignaciones()},
  {id:'usuarios',n:'Usuarios',r:['administrador'],f:()=>vistaUsuarios()},
  {id:'bitacora',n:'Bitácora',r:['administrador','director']}
];

const $ = (s,e=document) => e.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb, perfil, anio;

function toast(msg, tipo='info'){
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + tipo;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 4500);
}
function traducir(e){
  const m = (e && e.message) || String(e);
  if (/Invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
  if (/row-level security|permission denied/i.test(m)) return 'No tienes permiso para esta acción. Si es una nota, revisa si el periodo está cerrado.';
  if (/duplicate key/i.test(m)) return 'Ese dato ya existe.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'No hay conexión con el servidor. Revisa tu internet.';
  return m;
}
function logoFalla(i){ const s = document.createElement('span'); s.className = i.className + ' ph'; s.textContent = 'CR'; i.replaceWith(s); }
const logo = (c='') => `<img class="logo ${c}" src="${esc(CONFIG.LOGO)}" alt="" onerror="logoFalla(this)">`;
const clase = v => { const n = parseFloat(v); return isNaN(n) ? '' : n < 60 ? 'r1' : n < 70 ? 'r2' : ''; };
function interpretar(r, escala){
  if (/^[A-D]$/.test(r)) return escala === 'numerica' ? null : {valor_num:null, valor_lit:r};
  if (/^\d{1,3}(\.\d{1,2})?$/.test(r)){ const n = parseFloat(r); return (n > 100 || escala === 'literal') ? null : {valor_num:n, valor_lit:null}; }
  return null;
}

/* ---------- Inicio ---------- */
async function iniciar(){
  if (!CONFIG.SUPABASE_URL.startsWith('https://')){
    $('#app').innerHTML = '<div class="login"><div class="panel"><h2>Falta la configuración</h2><p>Abre el archivo index.html y reemplaza la URL y la clave pública de Supabase en la sección CONFIGURACIÓN.</p></div></div>';
    return;
  }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  const {data:{session}} = await sb.auth.getSession();
  session ? entrar(session.user) : vistaLogin();
}

function vistaLogin(msg=''){
  $('#app').innerHTML = `<div class="login"><form id="f">${logo('grande')}<h1>${esc(CONFIG.COLEGIO)}</h1><p class="mut">Sistema de control de notas</p>
    <label>Correo<input type="email" id="em" required autocomplete="username"></label>
    <label>Contraseña<input type="password" id="pw" required autocomplete="current-password"></label>
    <button class="btn" id="bt">Ingresar</button><p class="err" id="er">${esc(msg)}</p></form></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); $('#bt').disabled = true; $('#er').textContent = '';
    const {data, error} = await sb.auth.signInWithPassword({email:$('#em').value.trim(), password:$('#pw').value});
    if (error){ $('#er').textContent = traducir(error); $('#bt').disabled = false; return; }
    entrar(data.user);
  };
}

async function entrar(user){
  const {data:p} = await sb.from('perfiles').select('*').eq('id', user.id).maybeSingle();
  if (!p || !p.activo){ await sb.auth.signOut(); return vistaLogin('Tu usuario no tiene un perfil activo. Habla con el administrador.'); }
  perfil = p;
  const {data:a} = await sb.from('anios_escolares').select('*').eq('activo', true).maybeSingle();
  anio = a;
  vistaApp();
}

function vistaApp(){
  const mods = MODULOS.filter(m => m.r.includes(perfil.rol));
  $('#app').innerHTML = `<header class="top">${logo()}<div class="tit"><b>${esc(CONFIG.COLEGIO)}</b><small>Control de notas${anio ? ', año ' + esc(anio.nombre) : ''}</small></div>
    <div class="user"><span>${esc(perfil.nombres)} ${esc(perfil.apellidos)}</span><em>${ROLES[perfil.rol]}</em><button class="btn sec" id="out">Salir</button></div></header>
    <div class="wrap"><nav>${mods.map(m => `<button data-m="${m.id}" ${m.f ? '' : 'disabled'}>${m.n}${m.f ? '' : '<i>pronto</i>'}</button>`).join('')}</nav><main id="main"></main></div>`;
  $('#out').onclick = async () => { await sb.auth.signOut(); perfil = null; vistaLogin(); };
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => ir(b.dataset.m));
  const primero = mods.find(m => m.f);
  primero ? ir(primero.id) : $('#main').innerHTML = '<p>No hay módulos disponibles para tu rol.</p>';
}
function ir(id){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.m === id));
  MODULOS.find(m => m.id === id).f();
}

/* ---------- Notas ---------- */
async function vistaNotas(){
  const M = $('#main');
  if (!anio){ M.innerHTML = '<div class="panel"><p>No hay un año escolar activo. El administrador debe activarlo.</p></div>'; return; }
  M.innerHTML = '<p class="mut">Cargando…</p>';
  const doc = perfil.rol === 'docente';
  const rs = await Promise.all([
    sb.from('grados').select('*').order('orden'),
    sb.from('secciones').select('*'),
    sb.from('grupos').select('*').eq('anio_id', anio.id),
    sb.from('asignaturas').select('id,grado_id,nombre,orden,escala').eq('es_calculada', false).order('orden'),
    doc ? sb.from('asignaciones_docente').select('grupo_id,asignatura_id') : Promise.resolve({data:[]})
  ]);
  const fallo = rs.find(r => r.error);
  if (fallo){ M.innerHTML = `<p class="err">${esc(traducir(fallo.error))}</p>`; return; }
  const [g, s, gp, as, ad] = rs.map(r => r.data);
  const pares = new Set(ad.map(x => x.grupo_id + ':' + x.asignatura_id));
  const gr = Object.fromEntries(g.map(x => [x.id, x])), se = Object.fromEntries(s.map(x => [x.id, x.nombre]));
  let grupos = gp.map(x => ({...x, grado:gr[x.grado_id], nom:gr[x.grado_id].nombre + ' ' + se[x.seccion_id]}))
    .sort((a, b) => a.grado.orden - b.grado.orden || a.nom.localeCompare(b.nom));
  const asigDe = x => as.filter(a => a.grado_id === x.grado_id && (!doc || pares.has(x.id + ':' + a.id)));
  if (doc) grupos = grupos.filter(x => asigDe(x).length);
  if (!grupos.length){ M.innerHTML = '<div class="panel"><p>' + (doc ? 'Todavía no tienes materias asignadas. Pide al administrador que las asigne.' : 'Aún no hay grupos creados para este año.') + '</p></div>'; return; }
  M.innerHTML = `<div class="panel"><h2>Ingreso de notas</h2><div class="sel">
    <label>Grado y sección<select id="sg"><option value="">Elegir…</option>${grupos.map(x => `<option value="${x.id}">${esc(x.nom)}</option>`).join('')}</select></label>
    <label>Asignatura<select id="sa" disabled></select></label>
    <label>Periodo<select id="su" disabled></select></label></div></div><div id="tabla"></div>`;
  const val = id => $('#' + id).value, grupoSel = () => grupos.find(y => String(y.id) === val('sg'));
  $('#sg').onchange = () => {
    const x = grupoSel();
    $('#sa').innerHTML = x ? '<option value="">Elegir…</option>' + asigDe(x).map(a => `<option value="${a.id}">${esc(a.nombre)}</option>`).join('') : '';
    $('#su').innerHTML = x ? x.grado.etiquetas_periodo.map((e, i) => `<option value="${i + 1}">${esc(e)}</option>`).join('') : '';
    $('#sa').disabled = $('#su').disabled = !x; $('#tabla').innerHTML = '';
  };
  $('#sa').onchange = $('#su').onchange = () => {
    const x = grupoSel(), a = as.find(y => String(y.id) === val('sa'));
    if (x && a) cargarTabla(x, a, +val('su'));
  };
}

async function cargarTabla(grupo, asig, unidad){
  const T = $('#tabla'); T.innerHTML = '<p class="mut">Cargando alumnos…</p>';
  const {data:ins, error:e1} = await sb.from('inscripciones').select('id,alumno_id').eq('grupo_id', grupo.id);
  if (e1){ T.innerHTML = `<p class="err">${esc(traducir(e1))}</p>`; return; }
  if (!ins.length){ T.innerHTML = '<div class="panel"><p>Este grupo todavía no tiene alumnos inscritos.</p></div>'; return; }
  const ids = ins.map(i => i.id);
  const [al, ev, pm, es, nv] = await Promise.all([
    sb.from('alumnos').select('id,clave,nombres,apellidos').in('id', ins.map(i => i.alumno_id)),
    sb.from('evaluaciones').select('*').eq('grupo_id', grupo.id).eq('asignatura_id', asig.id).eq('unidad', unidad),
    sb.from('pma').select('inscripcion_id,puntos').eq('asignatura_id', asig.id).eq('unidad', unidad).in('inscripcion_id', ids),
    sb.from('unidades_estado').select('abierta').eq('anio_id', anio.id).eq('grado_id', grupo.grado_id).eq('unidad', unidad).maybeSingle(),
    sb.from('niveles').select('*').eq('id', grupo.grado.nivel_id).maybeSingle()
  ]);
  const fallo = [al, ev, pm, es, nv].find(r => r.error);
  if (fallo){ T.innerHTML = `<p class="err">${esc(traducir(fallo.error))}</p>`; return; }
  if (!nv.data){ T.innerHTML = '<div class="panel"><p class="aviso">Este grado no tiene nivel asignado. Avisa al administrador.</p></div>'; return; }
  const niv = nv.data, ORD = {corto:0, actividad:1, examen:2}, NOM = {corto:'Corto', actividad:'Actividad', examen:'Examen'};
  const evs = ev.data.sort((a, b) => ORD[a.tipo] - ORD[b.tipo] || a.numero - b.numero);
  const {data:cl, error:e2} = evs.length ? await sb.from('calificaciones').select('evaluacion_id,inscripcion_id,valor').in('evaluacion_id', evs.map(e => e.id)) : {data:[]};
  if (e2){ T.innerHTML = `<p class="err">${esc(traducir(e2))}</p>`; return; }
  const C = Object.fromEntries(cl.map(c => [c.evaluacion_id + ':' + c.inscripcion_id, +c.valor]));
  const P = Object.fromEntries(pm.data.map(p => [p.inscripcion_id, +p.puntos]));
  const dir = DIR.includes(perfil.rol), cerrada = !!es.data && es.data.abierta === false, bloqueada = cerrada && !dir;
  const ali = Object.fromEntries(al.data.map(a => [a.id, a]));
  const filas = ins.map(i => ({i, a:ali[i.alumno_id]})).filter(f => f.a)
    .sort((x, y) => (x.a.apellidos + x.a.nombres).localeCompare(y.a.apellidos + y.a.nombres));
  const dis = bloqueada ? 'disabled' : '', nombreEv = e => NOM[e.tipo] + (e.tipo === 'examen' ? '' : ' ' + e.numero);
  const rangos = ['90-100', '80-89', '70-79', '60-69', '50-59', '0-49'];
  T.innerHTML = `<div class="panel">${cerrada ? `<p class="aviso">Esta unidad está cerrada. ${dir ? 'Como dirección todavía puedes corregir.' : 'Ya no se pueden cambiar notas, solo verlas.'}</p>` : ''}
    <h3>${esc(asig.nombre)}</h3><p class="mut">${esc(grupo.nom)}, ${esc(grupo.grado.etiquetas_periodo[unidad - 1])}. ${esc(niv.nombre)}: cortos ${niv.peso_cortos}%, actividades ${niv.peso_actividades}%, examen ${niv.peso_examen} pts, PMA hasta ${niv.pma_max}.</p>
    ${bloqueada ? '' : `<div class="barra">${niv.peso_cortos > 0 ? '<button class="btn sec" data-t="corto">+ Corto</button>' : ''}<button class="btn sec" data-t="actividad">+ Actividad</button>${evs.some(e => e.tipo === 'examen') ? '' : '<button class="btn sec" data-t="examen">+ Examen</button>'}</div>`}
    ${evs.length ? '' : '<p class="aviso">Aún no hay columnas. Agrégalas con los botones y escribe las notas; el total se calcula solo.</p>'}
    <div class="scroll"><table class="n"><thead><tr><th>Clave</th><th>Alumno</th>${evs.map(e => `<th class="ev" data-e="${e.id}" title="Clic para cambiar el sobre cuánto o borrar">${nombreEv(e)}<small>/${+e.valor_maximo}</small></th>`).join('')}<th>Zona<small>/40</small></th><th>PMA<small>/${niv.pma_max}</small></th><th>Total<small>/100</small></th></tr></thead><tbody>
    ${filas.map(({i, a}) => `<tr data-i="${i.id}"><td>${esc(a.clave)}</td><td>${esc(a.apellidos)}, ${esc(a.nombres)}</td>${evs.map(e => { const v = C[e.id + ':' + i.id] ?? ''; return `<td><input class="nota" data-e="${e.id}" data-i="${i.id}" data-o="${v}" value="${v}" inputmode="decimal" aria-label="${esc(nombreEv(e))}, ${esc(a.nombres)} ${esc(a.apellidos)}" ${dis}></td>`; }).join('')}<td class="z">0</td><td><input class="nota pma" data-i="${i.id}" data-o="${P[i.id] ?? ''}" value="${P[i.id] ?? ''}" inputmode="decimal" aria-label="PMA, ${esc(a.nombres)} ${esc(a.apellidos)}" ${dis}></td><td class="t">0</td></tr>`).join('')}</tbody></table></div></div>
    <div class="panel"><h3>Estadística</h3><div class="scroll"><table class="est"><thead><tr>${rangos.map(r => `<th>${r}</th>`).join('')}</tr></thead><tbody><tr>${rangos.map((r, k) => `<td id="e${k}">0</td>`).join('')}</tr></tbody></table></div></div>`;

  const refrescar = async () => {
    const {data, error} = await sb.rpc('resumen_grupo', {p_grupo:grupo.id, p_asignatura:asig.id, p_unidad:unidad});
    if (error) return toast(traducir(error), 'mal');
    const cuenta = [0, 0, 0, 0, 0, 0];
    data.forEach(r => {
      const tr = T.querySelector(`tr[data-i="${r.inscripcion_id}"]`); if (!tr) return;
      tr.querySelector('.z').textContent = +r.zona;
      const t = tr.querySelector('.t'); t.textContent = +r.total; t.className = 't ' + clase(r.total);
      const n = Math.round(+r.total); cuenta[n >= 90 ? 0 : n >= 80 ? 1 : n >= 70 ? 2 : n >= 60 ? 3 : n >= 50 ? 4 : 5]++;
    });
    cuenta.forEach((c, k) => $('#e' + k).textContent = c);
  };
  const guardar = async (el, max, msg, subir, borrar) => {
    const raw = el.value.trim().replace(',', '.');
    if (raw === el.dataset.o) return;
    let r;
    if (raw === ''){ r = await borrar().select(); if (!r.error && !r.data.length) r.error = {message:'row-level security'}; }
    else {
      if (!/^\d+(\.\d{1,2})?$/.test(raw) || +raw > max){ el.classList.add('malo'); return toast(msg, 'mal'); }
      r = await subir(+raw);
    }
    if (r.error){ el.classList.add('malo'); return toast(traducir(r.error), 'mal'); }
    el.classList.remove('malo'); el.dataset.o = raw; refrescar();
  };
  T.querySelectorAll('input.nota:not(.pma)').forEach(el => {
    const e = evs.find(x => x.id === el.dataset.e), i = el.dataset.i;
    el.onchange = () => guardar(el, +e.valor_maximo, `Escribe un número entre 0 y ${+e.valor_maximo}.`,
      v => sb.from('calificaciones').upsert({evaluacion_id:e.id, inscripcion_id:i, valor:v}),
      () => sb.from('calificaciones').delete().eq('evaluacion_id', e.id).eq('inscripcion_id', i));
  });
  T.querySelectorAll('input.pma').forEach(el => {
    const i = el.dataset.i;
    el.onchange = () => guardar(el, niv.pma_max, `El PMA va de 0 a ${niv.pma_max}.`,
      v => sb.from('pma').upsert({inscripcion_id:i, asignatura_id:asig.id, unidad, puntos:v}),
      () => sb.from('pma').delete().eq('inscripcion_id', i).eq('asignatura_id', asig.id).eq('unidad', unidad));
  });
  T.querySelectorAll('button[data-t]').forEach(b => b.onclick = async () => {
    const tipo = b.dataset.t, numero = tipo === 'examen' ? 1 : Math.max(0, ...evs.filter(e => e.tipo === tipo).map(e => e.numero)) + 1;
    const r = prompt(`${NOM[tipo]}${tipo === 'examen' ? '' : ' ' + numero}: ¿sobre cuánto se califica?`, tipo === 'examen' ? niv.peso_examen : 100);
    if (r === null) return;
    const max = parseFloat(r.replace(',', '.'));
    if (!(max > 0 && max <= 9999)) return toast('Escribe un número mayor que 0.', 'mal');
    const {error} = await sb.from('evaluaciones').insert({grupo_id:grupo.id, asignatura_id:asig.id, unidad, tipo, numero, valor_maximo:max});
    error ? toast(traducir(error), 'mal') : cargarTabla(grupo, asig, unidad);
  });
  T.querySelectorAll('th.ev').forEach(th => th.onclick = async () => {
    if (bloqueada) return;
    const e = evs.find(x => x.id === th.dataset.e);
    const r = prompt(`${nombreEv(e)}: nuevo "sobre cuánto" (ahora ${+e.valor_maximo}).\nPara eliminar la columna con todas sus notas escribe BORRAR.`, +e.valor_maximo);
    if (r === null) return;
    let res;
    if (r.trim().toUpperCase() === 'BORRAR'){
      if (!confirm('¿Eliminar esta columna y todas sus notas?')) return;
      res = await sb.from('evaluaciones').delete().eq('id', e.id).select('id');
    } else {
      const max = parseFloat(r.replace(',', '.'));
      if (!(max > 0 && max <= 9999)) return toast('Escribe un número mayor que 0.', 'mal');
      res = await sb.from('evaluaciones').update({valor_maximo:max}).eq('id', e.id).select('id');
    }
    if (res.error || !res.data.length) return toast(res.error ? traducir(res.error) : 'No tienes permiso para este cambio.', 'mal');
    cargarTabla(grupo, asig, unidad);
  });
  refrescar();
}

/* ---------- Importar alumnos ---------- */
const norm = t => String(t ?? '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function vistaImportar(){
  const M = $('#main');
  if (!anio){ M.innerHTML = '<div class="panel"><p>No hay un año escolar activo.</p></div>'; return; }
  M.innerHTML = `<div class="panel"><h2>Importar alumnos</h2>
    <p class="mut">Sube un archivo de Excel (.xlsx) o CSV con las columnas <b>Clave, Nombres, Apellidos, Grado, Sección</b>. Los alumnos se inscriben en el año ${esc(anio.nombre)}. Si la clave ya existe se actualiza el nombre; si el alumno ya está inscrito este año, no se mueve de sección. Los grupos que no existan se crean solos.</p>
    <div class="barra"><button class="btn sec" id="pl">Descargar plantilla</button><input type="file" id="ar" accept=".xlsx,.xls,.csv"></div><div id="prev"></div></div>`;
  const sinLector = () => typeof XLSX === 'undefined' && (toast('No se pudo cargar el lector de Excel. Revisa tu internet y recarga la página.', 'mal'), true);
  $('#pl').onclick = () => {
    if (sinLector()) return;
    const ws = XLSX.utils.aoa_to_sheet([['Clave', 'Nombres', 'Apellidos', 'Grado', 'Sección'], ['2026001', 'Ana María', 'López Pérez', 'Onceavo', 'A'], ['2026002', 'Luis', 'Gómez Díaz', 'Onceavo', 'B']]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Alumnos'); XLSX.writeFile(wb, 'plantilla_alumnos.xlsx');
  };
  $('#ar').onchange = async ev => {
    const f = ev.target.files[0]; if (!f || sinLector()) return;
    const P = $('#prev'); P.innerHTML = '<p class="mut">Revisando el archivo…</p>';
    const wb = XLSX.read(await f.arrayBuffer());
    const crudo = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    const rs = await Promise.all([sb.from('grados').select('id,nombre'), sb.from('secciones').select('id,nombre'), sb.from('grupos').select('id,grado_id,seccion_id').eq('anio_id', anio.id)]);
    const fallo = rs.find(r => r.error);
    if (fallo){ P.innerHTML = `<p class="err">${esc(traducir(fallo.error))}</p>`; return; }
    const gr = Object.fromEntries(rs[0].data.map(x => [norm(x.nombre), x]));
    const buenas = [], errores = [], vistas = new Set();
    crudo.forEach((r, n) => {
      const c = {}; Object.keys(r).forEach(k => c[norm(k)] = String(r[k]).trim());
      const b = {clave:c.clave, nombres:c.nombres, apellidos:c.apellidos, grado:c.grado, seccion:(c.seccion || '').toUpperCase()}, lin = n + 2;
      if (!b.clave && !b.nombres && !b.apellidos) return;
      if (!b.clave || !b.nombres || !b.apellidos || !b.seccion) return errores.push(`Fila ${lin}: faltan datos.`);
      if (!gr[norm(b.grado)]) return errores.push(`Fila ${lin}: grado no reconocido (${b.grado || 'vacío'}).`);
      if (vistas.has(b.clave)) return errores.push(`Fila ${lin}: clave repetida (${b.clave}).`);
      vistas.add(b.clave); buenas.push({...b, gid:gr[norm(b.grado)].id});
    });
    P.innerHTML = `<p><b>${buenas.length}</b> alumno(s) listos para importar${errores.length ? `, <b>${errores.length}</b> fila(s) con problemas` : ''}.</p>
      ${errores.length ? `<div class="aviso">${errores.slice(0, 15).map(esc).join('<br>')}${errores.length > 15 ? '<br>…' : ''}</div>` : ''}
      ${buenas.length ? '<button class="btn pie" id="go">Importar ahora</button>' : ''}`;
    if (buenas.length) $('#go').onclick = () => importarAlumnos(buenas, errores.length, rs);
  };
}
async function importarAlumnos(buenas, nErr, rs){
  const go = $('#go'); go.disabled = true; go.textContent = 'Importando…';
  try {
    const sec = Object.fromEntries(rs[1].data.map(x => [norm(x.nombre), x.id]));
    const nuevasSec = [...new Set(buenas.map(b => b.seccion))].filter(s => !sec[norm(s)]);
    if (nuevasSec.length){
      const {data, error} = await sb.from('secciones').insert(nuevasSec.map(nombre => ({nombre}))).select('id,nombre');
      if (error) throw error; data.forEach(x => sec[norm(x.nombre)] = x.id);
    }
    const gp = Object.fromEntries(rs[2].data.map(x => [x.grado_id + ':' + x.seccion_id, x.id])), faltan = new Map();
    buenas.forEach(b => { b.sid = sec[norm(b.seccion)]; const k = b.gid + ':' + b.sid; if (!gp[k]) faltan.set(k, {anio_id:anio.id, grado_id:b.gid, seccion_id:b.sid}); });
    if (faltan.size){
      const {data, error} = await sb.from('grupos').insert([...faltan.values()]).select('id,grado_id,seccion_id');
      if (error) throw error; data.forEach(x => gp[x.grado_id + ':' + x.seccion_id] = x.id);
    }
    const ids = {};
    for (let i = 0; i < buenas.length; i += 200){
      const {data, error} = await sb.from('alumnos').upsert(buenas.slice(i, i + 200).map(b => ({clave:b.clave, nombres:b.nombres, apellidos:b.apellidos})), {onConflict:'clave'}).select('id,clave');
      if (error) throw error; data.forEach(x => ids[x.clave] = x.id);
    }
    let nuevas = 0;
    for (let i = 0; i < buenas.length; i += 200){
      const lote = buenas.slice(i, i + 200).map(b => ({alumno_id:ids[b.clave], grupo_id:gp[b.gid + ':' + b.sid], anio_id:anio.id}));
      const {data, error} = await sb.from('inscripciones').upsert(lote, {onConflict:'alumno_id,anio_id', ignoreDuplicates:true}).select('id');
      if (error) throw error; nuevas += data.length;
    }
    await sb.from('importaciones').insert({usuario_id:perfil.id, tipo:'alumnos', filas_ok:buenas.length, filas_error:nErr});
    $('#prev').innerHTML = `<p class="tag ok">Listo: ${buenas.length} alumno(s) procesados, ${nuevas} inscrito(s) nuevos en ${esc(anio.nombre)}.</p>`;
  } catch (e){ toast(traducir(e), 'mal'); go.disabled = false; go.textContent = 'Importar ahora'; }
}

/* ---------- Boletas ---------- */
function boletaHtml(f, r, grupo, ina, com, txt){
  const a = f.a, et = grupo.grado.etiquetas_periodo;
  if (r.error) return `<div class="boleta"><p class="err">${esc(a.apellidos)}, ${esc(a.nombres)}: ${esc(traducir(r.error))}</p></div>`;
  let area = null;
  const filas = r.data.map(x => {
    const cab = x.area && x.area !== area ? `<tr><th colspan="6" class="area">${esc(x.area)}</th></tr>` : '';
    area = x.area;
    return cab + `<tr><td>${esc(x.asignatura)}</td>${[x.u1, x.u2, x.u3, x.u4].map(v => `<td class="c">${esc(v ?? '')}</td>`).join('')}<td class="c"><b>${esc(x.nota_oficial ?? '')}</b></td></tr>`;
  }).join('');
  const mi = u => ina.find(z => z.inscripcion_id === f.i.id && z.unidad === u);
  const cm = com.filter(z => z.inscripcion_id === f.i.id && (z.observacion_es_id || z.comentario_en_id)).sort((p, q) => p.unidad - q.unidad);
  const cab4 = et.map(e => `<th class="c">${esc(e)}</th>`).join('');
  return `<div class="boleta"><h3>${esc(CONFIG.COLEGIO)}</h3><p>Boleta de calificaciones, año ${esc(anio.nombre)}</p>
    <p class="bal"><b>Alumno:</b> ${esc(a.apellidos)}, ${esc(a.nombres)} <span>Clave: ${esc(a.clave)}</span> <span>Grado y sección: ${esc(grupo.nom)}</span></p>
    <table><thead><tr><th>Asignatura</th>${cab4}<th class="c">Nota oficial</th></tr></thead><tbody>${filas}</tbody></table>
    <table><thead><tr><th>Inasistencias</th>${cab4}</tr></thead><tbody><tr><td>Cantidad</td>${[1, 2, 3, 4].map(u => `<td class="c">${mi(u) ? mi(u).cantidad : ''}</td>`).join('')}</tr></tbody></table>
    ${cm.length ? `<table><thead><tr><th>Unidad</th><th>Observaciones</th><th>Comments</th></tr></thead><tbody>${cm.map(c => `<tr><td>${esc(et[c.unidad - 1])}</td><td>${esc(txt[c.observacion_es_id] ?? '')}</td><td>${esc(txt[c.comentario_en_id] ?? '')}</td></tr>`).join('')}</tbody></table>` : ''}
    <div class="firmas"><span>Director(a)</span><span>Coordinación</span></div></div>`;
}
async function vistaBoletas(){
  const M = $('#main');
  if (!anio){ M.innerHTML = '<div class="panel"><p>No hay un año escolar activo.</p></div>'; return; }
  M.innerHTML = '<p class="mut">Cargando…</p>';
  const rs = await Promise.all([
    sb.from('grados').select('id,nombre,orden,etiquetas_periodo'), sb.from('secciones').select('id,nombre'),
    sb.from('grupos').select('id,grado_id,seccion_id').eq('anio_id', anio.id)
  ]);
  const fallo = rs.find(r => r.error);
  if (fallo){ M.innerHTML = `<p class="err">${esc(traducir(fallo.error))}</p>`; return; }
  const [g, s, gp] = rs.map(r => r.data);
  const gr = Object.fromEntries(g.map(x => [x.id, x])), se = Object.fromEntries(s.map(x => [x.id, x.nombre]));
  const grupos = gp.map(x => ({...x, grado:gr[x.grado_id], nom:gr[x.grado_id].nombre + ' ' + se[x.seccion_id]}))
    .sort((a, b) => a.grado.orden - b.grado.orden || a.nom.localeCompare(b.nom));
  if (!grupos.length){ M.innerHTML = '<div class="panel"><p>Aún no hay grupos creados para este año.</p></div>'; return; }
  M.innerHTML = `<div class="panel no-print"><h2>Boletas</h2><label>Grado y sección<select id="bg">${grupos.map(x => `<option value="${x.id}">${esc(x.nom)}</option>`).join('')}</select></label></div><div id="blista" class="no-print"></div><div id="bol"></div>`;
  const cargar = async () => {
    const grupo = grupos.find(x => String(x.id) === $('#bg').value), L = $('#blista'); $('#bol').innerHTML = '';
    L.innerHTML = '<p class="mut">Cargando alumnos…</p>';
    const {data:ins, error} = await sb.from('inscripciones').select('id,alumno_id').eq('grupo_id', grupo.id);
    if (error){ L.innerHTML = `<p class="err">${esc(traducir(error))}</p>`; return; }
    if (!ins.length){ L.innerHTML = '<div class="panel"><p>Este grupo todavía no tiene alumnos inscritos.</p></div>'; return; }
    const {data:al, error:e2} = await sb.from('alumnos').select('id,clave,nombres,apellidos,solvente').in('id', ins.map(i => i.alumno_id));
    if (e2){ L.innerHTML = `<p class="err">${esc(traducir(e2))}</p>`; return; }
    const ali = Object.fromEntries(al.map(a => [a.id, a]));
    const filas = ins.map(i => ({i, a:ali[i.alumno_id]})).filter(f => f.a)
      .sort((x, y) => (x.a.apellidos + x.a.nombres).localeCompare(y.a.apellidos + y.a.nombres));
    L.innerHTML = `<div class="panel"><div class="barra"><button class="btn" id="btodas">Ver las boletas de todo el grupo</button></div><div class="scroll"><table><thead><tr><th>Clave</th><th>Alumno</th><th>Solvencia</th><th></th></tr></thead><tbody>
      ${filas.map(f => `<tr><td>${esc(f.a.clave)}</td><td>${esc(f.a.apellidos)}, ${esc(f.a.nombres)}</td><td><span class="tag ${f.a.solvente ? 'ok' : 'mal'}">${f.a.solvente ? 'Solvente' : 'Insolvente'}</span></td><td><button class="btn sec" data-i="${f.i.id}" ${f.a.solvente ? '' : 'disabled'}>Ver boleta</button></td></tr>`).join('')}</tbody></table></div></div>`;
    const mostrar = async (lista, aviso) => {
      const B = $('#bol'); B.innerHTML = '<p class="mut no-print">Preparando boletas…</p>';
      const ids = lista.map(f => f.i.id);
      const [ina, com, cat] = await Promise.all([
        sb.from('inasistencias').select('inscripcion_id,unidad,cantidad').in('inscripcion_id', ids),
        sb.from('comentarios_inscripcion').select('inscripcion_id,unidad,comentario_en_id,observacion_es_id').in('inscripcion_id', ids),
        sb.from('catalogo_comentarios').select('id,texto')
      ]);
      const txt = Object.fromEntries((cat.data || []).map(c => [c.id, c.texto])), nb = [];
      for (let k = 0; k < lista.length; k += 6) nb.push(...await Promise.all(lista.slice(k, k + 6).map(f => sb.rpc('boleta_notas', {p_inscripcion:f.i.id}))));
      B.innerHTML = `<div class="barra no-print"><button class="btn" id="bimp">Imprimir o guardar como PDF</button></div>${aviso ? `<p class="aviso no-print">${esc(aviso)}</p>` : ''}`
        + lista.map((f, n) => boletaHtml(f, nb[n], grupo, ina.data || [], com.data || [], txt)).join('');
      $('#bimp').onclick = () => window.print();
      B.scrollIntoView();
    };
    L.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => mostrar(filas.filter(f => f.i.id === b.dataset.i)));
    $('#btodas').onclick = () => {
      const ok = filas.filter(f => f.a.solvente), n = filas.length - ok.length;
      if (!ok.length) return toast('Ningún alumno de este grupo está solvente.', 'mal');
      mostrar(ok, n ? `No se incluyen ${n} alumno(s) insolvente(s).` : '');
    };
  };
  $('#bg').onchange = cargar; cargar();
}

iniciar();
</script>
</body>
</html>
